<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Worktree</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <!-- ext:css -->
</head>
<body>
  <main>
    <div id="tree" class="tree"></div>
  </main>
  <footer>
    <div class="row">
      <button id="btn-new-tab" type="button">+ Tab <span class="kbd">⌘T</span></button>
      <button id="btn-new-window" type="button">+ Window <span class="kbd">⌘N</span></button>
    </div>
    <div class="row">
      <button id="btn-split-vertical" type="button">⊢ Split <span class="kbd">⌘D</span></button>
      <button id="btn-split-horizontal" type="button">⊤ Split <span class="kbd">⌘⇧D</span></button>
    </div>
    <div class="row icons" id="footer-icons">
      <button id="btn-cheatsheet" type="button" class="icon-btn" title="iTerm cheatsheet">
        <span class="icon-btn-glyph">▤</span><span class="icon-btn-label">iTerm</span>
      </button>
      <button id="btn-settings" type="button" class="icon-btn" title="Settings">
        <span class="icon-btn-glyph">⚙</span><span class="icon-btn-label">Settings</span>
      </button>
      <button id="btn-restore" type="button" class="icon-btn" title="Restore last saved workspace — recreates panes and resumes Claude sessions">
        <span class="icon-btn-glyph">⟲</span><span class="icon-btn-label">Restore</span>
      </button>
    </div>
    <div class="status hidden" id="status"></div>
  </footer>
  <script src="/static/app.js"></script>
  <!-- ext:js -->
</body>
</html>
