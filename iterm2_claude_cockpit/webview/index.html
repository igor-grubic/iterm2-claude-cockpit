<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Claude Cockpit</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main>
    <div id="tree" class="tree"></div>
  </main>
  <footer>
    <div class="row">
      <button id="btn-new-tab" type="button">+ Tab <span class="kbd">⌘T</span></button>
      <button id="btn-new-window" type="button">+ Window <span class="kbd">⌘N</span></button>
    </div>
    <div class="row">
      <button id="btn-split-vertical" type="button">⊢ Split <span class="kbd">⌘D</span></button>
      <button id="btn-split-horizontal" type="button">⊤ Split <span class="kbd">⌘⇧D</span></button>
    </div>
    <div class="row icons" id="footer-icons">
      <button id="btn-cheatsheet" type="button" class="nav-btn" title="iTerm cheatsheet">iTerm</button>
      <button id="btn-claude" type="button" class="nav-btn" title="Claude Code cheatsheet">Claude</button>
      <button id="btn-settings" type="button" class="nav-btn" title="Settings">Settings</button>
      <button id="btn-restore" type="button" class="nav-btn" title="Restore last saved workspace — recreates your windows, tabs, and panes in their saved directories">Restore</button>
    </div>
    <div class="status hidden" id="status"></div>
  </footer>
  <script src="/static/app.js"></script>
</body>
</html>
